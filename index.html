<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy | Ground-Truth Field Intelligence</title>
  <style>
    :root {
      --bg-color: #0b0b0e;
      --card-bg: #141419;
      --accent-purple: #d900ff;
      --accent-pink: #ff007a;
      --text-main: #ffffff;
      --text-sub: #a0a0ab;
      --border-color: #26262e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    .logo-icon {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      transform: rotate(45deg);
      border-radius: 4px;
    }

    .btn-auth {
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-auth:hover {
      opacity: 0.9;
    }

    .container {
      display: flex;
      flex: 1;
      padding: 40px;
      gap: 40px;
    }

    .sidebar {
      width: 320px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border: 1px solid var(--border-color);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .user-info .email {
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-all;
    }

    .user-info .role {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    textarea, input[type="text"] {
      width: 100%;
      background-color: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      color: white;
      outline: none;
    }

    textarea {
      height: 100px;
      resize: none;
    }

    .btn-submit {
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
      color: white;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .feed {
      flex: 1;
    }

    .feed h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon"></div>
      <span>LEGACY</span>
    </div>
    <button id="auth-btn" class="btn-auth">Sign In / Register</button>
  </header>

  <div class="container">
    <!-- User Panel / Form Sidebar -->
    <div class="sidebar">
      <div class="user-profile">
        <div id="user-avatar" class="avatar">U</div>
        <div class="user-info">
          <div id="user-email" class="email">Authenticated User</div>
          <div class="role">Verified Field Contributor</div>
        </div>
      </div>

      <div class="input-group">
        <label>Publish New Log</label>
        <textarea id="field-narrative" placeholder="Field narrative..."></textarea>
        <input type="text" id="location-target" placeholder="Location target..." />
        <button class="btn-submit">Publish Entry</button>
      </div>
    </div>

    <!-- Main Content Feed -->
    <div class="feed">
      <h2>Community Field Feed</h2>
      <div id="feed-container">
        <!-- Feed posts render here -->
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
