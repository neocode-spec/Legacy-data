<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="logo">LEGACY</div>
    <div id="nav-actions">
      <!-- Dynamic Buttons populated by JS -->
    </div>
  </header>

  <!-- PAGE 1: LANDING PAGE -->
  <section id="page-landing" class="page-view active">
    <div class="hero">
      <h1>Ground-Truth Field Intelligence</h1>
      <p>Read community observations, verify data logs, and contribute datasets.</p>
      <button class="primary-btn" onclick="switchPage('page-auth')">Get Started</button>
    </div>
  </section>

  <!-- PAGE 2: AUTHENTICATION PORTAL -->
  <section id="page-auth" class="page-view">
    <div class="auth-card">
      <h2>Access Portal</h2>
      <input type="email" id="auth-email" placeholder="Email Address">
      <input type="password" id="auth-pass" placeholder="Password">
      <div class="auth-btns">
        <button id="btn-login" class="primary-btn">Sign In</button>
        <button id="btn-signup" class="secondary-btn">Register</button>
      </div>
      <p class="divider">OR</p>
      <button id="btn-google" class="google-btn">Continue with Google</button>
    </div>
  </section>

  <!-- PAGE 3: MAIN APP (FEED, SEARCH, & UPLOAD) -->
  <section id="page-app" class="page-view">
    <div class="app-layout">
      
      <!-- SIDEBAR: CREATION & SEARCH OVERLAY -->
      <aside class="sidebar">
        <div class="user-profile">
          <div id="profile-avatar" class="avatar">U</div>
          <span id="profile-email">user@domain.com</span>
        </div>

        <hr>

        <!-- Search Drawer -->
        <div class="search-box">
          <h3>Search Logs</h3>
          <input type="text" id="search-input" placeholder="Search keywords or location...">
        </div>

        <hr>

        <!-- Publish & File Upload Form -->
        <div class="upload-box">
          <h3>New Entry</h3>
          <textarea id="obs-text" placeholder="Write observation narrative..."></textarea>
          <input type="text" id="loc-text" placeholder="Target Location">
          
          <label class="file-label">
            <span>📎 Attach Dataset / Doc</span>
            <input type="file" id="file-input" accept=".csv, .pdf, .json, .txt, .png, .jpg">
          </label>
          <span id="file-name-display" class="file-name">No file selected</span>

          <button id="save-btn" class="primary-btn">Publish Entry</button>
        </div>
      </aside>

      <!-- MAIN FEED VIEW -->
      <main class="feed-container">
        <h2>Community Feed</h2>
        <div id="public-feed" class="feed-list">
          <!-- Feed items will be prepended here -->
        </div>
      </main>

    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
